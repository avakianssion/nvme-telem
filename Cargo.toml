[package]
name = "nvme-telem"
version = "0.3.1"
edition = "2024"          
license = "MIT"
description = "NVMe S.M.A.R.T. / telemetry collection for Linux"
repository = "https://gitlab.com/avakianssion/nvme-telem"
documentation = "https://docs.rs/crate/nvme-telem"
readme = "README.md"
categories = ["hardware-support"]
keywords = ["nvme", "storage", "telemetry", "smart", "monitoring"]
authors = ["Sion Avakian <avakianssion@gmail.com>"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
nvme-cli-sys = "1.0.0"  

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "sanity_check"
doc-scrape-examples = false
