image: rockylinux:9

stages: [lint, build, version-check, publish]

before_script:
  - dnf install -y clang-devel llvm-devel
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
  - source "$HOME/.cargo/env"
  - rustup component add rustfmt clippy
  
fmt:
  stage: lint
  script:
    - cargo fmt --all -- --check

clippy:
  stage: lint
  script:
    - cargo clippy --all-targets --all-features

build:
  stage: build
  script:
    - cargo build

check-version:
  stage: version-check
  script:
    - CURRENT_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
    - echo "Checking version $CURRENT_VERSION"
    
    # Check if version already exists on crates.io
    - |
      if cargo search nvme-telem | grep -q "nvme-telem = \"$CURRENT_VERSION\""; then
        echo "ERROR: Version $CURRENT_VERSION already published on crates.io"
        echo "Please bump the version in Cargo.toml before merging"
        exit 1
      fi
    
    # Check if version tag exists in git
    - git fetch --tags
    - |
      if git tag -l | grep -q "^v$CURRENT_VERSION$"; then
        echo "ERROR: Version v$CURRENT_VERSION already tagged in git"
        echo "Please bump the version in Cargo.toml before merging"
        exit 1
      fi
    
    - echo "Version $CURRENT_VERSION is new - OK to publish!"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

publish:
  stage: publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  script:
    - cargo publish --token ${CARGO_REGISTRY_TOKEN}
